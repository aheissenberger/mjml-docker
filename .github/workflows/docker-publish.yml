name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the image and resolve its tags without pushing
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "version=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ !inputs.dry_run }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.version }}
            ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && format('ghcr.io/{0}:latest', github.repository) || '' }}
