# Reads the API key from a file instead of the container environment.
# Usage: docker compose -f compose.yaml -f compose.secrets.yaml up
services:
  api:
    environment:
      API_KEY: !reset null
      API_KEY_FILE: /run/secrets/api_key
    secrets:
      - api_key

secrets:
  api_key:
    file: ${API_KEY_SECRET_FILE:?API_KEY_SECRET_FILE is required}
